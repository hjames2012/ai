version: 2.1

executors:
  macos-executor:
    macos:
      xcode: "14.2.0"  # Or latest available
    resource_class: macos.medium

jobs:
  build-mac-app:
    executor: macos-executor
    steps:
      - checkout
      - run:
          name: Install Homebrew dependencies
          command: |
            brew install python3 create-dmg
      - run:
          name: Install Python dependencies
          command: |
            python3 -m pip install --upgrade pip
            python3 -m pip install pyinstaller pyqt5 google-generativeai requests python-dotenv speechrecognition pyaudio
      - run:
          name: Build .app with PyInstaller
          command: |
            python3 -m PyInstaller --noconfirm --windowed --onefile --name "Gemini AI Chat" --add-data=.env:. desktop_app.py
      - run:
          name: Create DMG installer
          command: |
            create-dmg "dist/Gemini AI Chat.app"
      - store_artifacts:
          path: dist
          destination: dist

workflows:
  version: 2
  build:
    jobs:
      - build-mac-app
